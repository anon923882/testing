name: Motif Android Spotify APK
on:
  pull_request:
    paths:
      - "motif-source.zip"
      - ".github/workflows/motif-android-ci.yml"
  push:
    branches:
      - "motif/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack Motif
        run: |
          mkdir -p motif
          unzip -q motif-source.zip -d motif
      - name: Probe Android Python dependency compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          f = Path("motif/app/build.gradle")
          s = f.read_text()
          s = s.replace("install 'librespot==0.0.10'","""options('--no-deps')
            install 'librespot==0.0.10'
            install 'pycryptodomex==3.21.0'
            install 'protobuf==3.20.1'
            install 'defusedxml>=0.7.1'
            install 'pyogg==0.5.11a1'
            install 'requests>=2.32.3'
            install 'websocket-client>=1.8.0'
            install 'zeroconf==0.39.4'
            install 'urllib3==2.2.3'
            install 'idna==3.10'
            install 'certifi==2025.1.31'
            install 'charset-normalizer==3.4.0'
            install 'ifaddr==0.2.0'""")
          f.write_text(s)
          PY
      - name: Validate source
        working-directory: motif
        run: |
          python -m unittest discover -s tests -p test_spotify_offline.py -v
          node --check app/src/main/assets/app.js
      - name: Android Java unit tests
        working-directory: motif
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run UI stress tests
        working-directory: motif
        run: python tests/test_ui_end_to_end.py
      - name: Compile APK
        working-directory: motif
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify packaged Python dependencies
        working-directory: motif
        run: |
          python - <<'PY'
          import io,zipfile,glob
          apk=zipfile.ZipFile(glob.glob("app/build/outputs/apk/debug/*.apk")[0])
          py=zipfile.ZipFile(io.BytesIO(apk.read("assets/chaquopy/requirements-common.imy")))
          paths=py.namelist()
          needed=["urllib3/","idna/","certifi/","charset_normalizer/","requests/","librespot/","zeroconf/","ifaddr/","pyogg/","Cryptodome/"]
          missing=[n for n in needed if not any(x.startswith(n) for x in paths)]
          print("Packaged Python modules:",", ".join(needed))
          assert not missing,"Missing Python dependencies: "+", ".join(missing)
          PY
      - name: Upload Android signing utility
        uses: actions/upload-artifact@v4
        with:
          name: Motif-QA-apksigner-tool
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Motif-Spotify-debug-apk
          path: motif/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
